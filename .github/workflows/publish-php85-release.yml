name: Publish PHP 8.5 release

on:
  push:
    branches:
      - automation/publish-php85-release-20260831

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout merged master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: ctype, dom, fileinfo, filter, gd, iconv, intl, json, mbstring, pdo, pdo_sqlite, simplexml, tokenizer, xml, xmlwriter
      - name: Validate merged source
        run: |
          set -euo pipefail
          composer validate --strict --no-check-publish
          php -r '$c=json_decode(file_get_contents("composer.json"),true,512,JSON_THROW_ON_ERROR); if (!str_contains((string)($c["require"]["php"]??""),"8.5")) exit(1); foreach (["require","require-dev"] as $s) foreach (($c[$s]??[]) as $n=>$v) if (str_starts_with($n,"symfony/") && !str_starts_with($n,"symfony/polyfill-") && !str_contains((string)$v,"7.4")) exit(1); if (!str_contains((string)($c["require-dev"]["phpunit/phpunit"]??""),"12")) exit(1);'
          test ! -e .travis.yml
          ! grep -R --line-number --include='*.php' -E 'Twig_Extension|Twig_Simple(Filter|Function)|ContainerAware|Controller\\Controller|\$this->get\(|getDoctrine\(' . --exclude-dir=vendor --exclude-dir=.git
          grep -R -q "php-version: ['\"]8.5" .github/workflows
          grep -R -q 'prefer-lowest' .github/workflows
          grep -R -q 'actions/checkout@v6' .github/workflows
          test ! -d .upgrade
          ! find .github/workflows -maxdepth 1 -type f \( -name 'temporary-*' -o -name 'export-*' \) | grep -q .
      - name: Verify stable dependencies
        run: |
          set -euo pipefail
          rm -rf vendor composer.lock .phpunit.cache
          composer update --prefer-dist --no-interaction
          find . -path ./vendor -prune -o -path ./.git -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          vendor/bin/phpunit -c phpunit.xml.dist --display-deprecations --display-phpunit-deprecations --display-phpunit-notices --fail-on-phpunit-notice --display-notices --display-skipped
      - name: Verify lowest dependencies
        run: |
          set -euo pipefail
          rm -rf vendor composer.lock .phpunit.cache
          composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction
          find . -path ./vendor -prune -o -path ./.git -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          vendor/bin/phpunit -c phpunit.xml.dist --display-deprecations --display-phpunit-deprecations --display-phpunit-notices --fail-on-phpunit-notice --display-notices --display-skipped
      - name: Publish immutable major release and close epic
        run: |
          set -euo pipefail
          git fetch origin master --tags
          latest=$(git tag -l --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -z "$latest" ]; then version=1.0.0; else version=$(python3 - "$latest" <<'PY'
          import re,sys
          m=re.fullmatch(r'v?(\d+)\.(\d+)\.(\d+)',sys.argv[1]); print(f'{int(m.group(1))+1}.0.0')
          PY
          ); fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then test "$(git rev-list -n1 "$version")" = "$(git rev-parse HEAD)"; else git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git tag -a "$version" -m "AzineSocialBarBundle $version"; git push origin "$version"; fi
          if ! gh release view "$version" -R "$REPOSITORY" >/dev/null 2>&1; then gh release create "$version" -R "$REPOSITORY" --verify-tag --title "$version — PHP 8.5 / Symfony 7.4" --notes 'Major upgrade to PHP 8.5, Symfony 7.4, Twig 3 and PHPUnit 12. Preserves the documented social-bar rendering contract, modernizes dependency injection, removes obsolete CI/runtime integrations, and validates stable and lowest dependency sets.'; fi
          for issue in 6 7 8; do if gh issue view "$issue" -R "$REPOSITORY" --json state --jq .state 2>/dev/null | grep -q OPEN; then gh issue comment "$issue" -R "$REPOSITORY" --body "Completed by the merged upgrade and immutable release \`$version\`."; gh issue close "$issue" -R "$REPOSITORY" --reason completed; fi; done
          gh issue comment 5 -R "$REPOSITORY" --body "Upgrade complete. The merged \`master\` source independently passed PHP 8.5 stable and lowest dependency validation and was published as immutable release \`$version\`."
          gh issue close 5 -R "$REPOSITORY" --reason completed
          git push origin --delete automation/publish-php85-release-20260831 || true
          git push origin --delete automation/finalize-php85-20260831 || true
