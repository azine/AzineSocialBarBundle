name: Publish Social Bar 3.0.0

on:
  push:
    branches: [release/publish-3.0.0]
    paths: ['.github/workflows/publish-3.0.0.yml']

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Publish 3.0.0 tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a 3.0.0 25e1efb9b203078db4aa76f8c811516a8e1b624a -m 'PHP 8.5 / Symfony 7.4 / Twig 3 release'
          git push origin 3.0.0
