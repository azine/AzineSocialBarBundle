name: Finalize PHP 8.5 upgrade

on:
  push:
    branches:
      - automation/finalize-php85-20260831

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Locate authoritative upgrade PR
        id: candidate
        run: |
          set -euo pipefail
          pr_json=$(gh pr list -R "$REPOSITORY" --state open --limit 100 --json number,title,headRefName,baseRefName,isDraft,headRepositoryOwner --jq '[.[] | select(.baseRefName == "master") | select((.title | ascii_downcase | contains("upgrade")) or (.title | contains("PHP 8.5")) or (.title | contains("Symfony 7.4"))) | select(.headRepositoryOwner.login == "azine")] | sort_by(.number) | last')
          test -n "$pr_json"
          test "$pr_json" != "null"
          echo "number=$(jq -r .number <<<"$pr_json")" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r .headRefName <<<"$pr_json")" >> "$GITHUB_OUTPUT"
          echo "draft=$(jq -r .isDraft <<<"$pr_json")" >> "$GITHUB_OUTPUT"

      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.candidate.outputs.branch }}
          fetch-depth: 0

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: ctype, dom, fileinfo, filter, gd, iconv, intl, json, mbstring, pdo, pdo_sqlite, simplexml, tokenizer, xml, xmlwriter

      - name: Validate upgrade structure
        run: |
          set -euo pipefail
          composer validate --strict --no-check-publish
          php -r '$c=json_decode(file_get_contents("composer.json"),true,512,JSON_THROW_ON_ERROR); if (!str_contains((string)($c["require"]["php"]??""),"8.5")) {fwrite(STDERR,"PHP 8.5 constraint missing\n"); exit(1);} foreach (["require","require-dev"] as $s) {foreach (($c[$s]??[]) as $n=>$v) {if (str_starts_with($n,"symfony/") && !str_starts_with($n,"symfony/polyfill-") && !str_contains((string)$v,"7.4")) {fwrite(STDERR,"$n must target Symfony 7.4, got $v\n"); exit(1);}}} if (isset($c["require"]["symfony/symfony"])) {fwrite(STDERR,"symfony/symfony monolith remains\n"); exit(1);} if (!str_contains((string)($c["require-dev"]["phpunit/phpunit"]??""),"12")) {fwrite(STDERR,"PHPUnit 12 constraint missing\n"); exit(1);}'
          test ! -e .travis.yml
          ! grep -R --line-number --include='*.php' -E 'Twig_Extension|Twig_Simple(Filter|Function)|ContainerAware|Controller\\Controller|\$this->get\(|getDoctrine\(' . --exclude-dir=vendor --exclude-dir=.git
          grep -R -q "php-version: ['\"]8.5" .github/workflows
          grep -R -q 'prefer-lowest' .github/workflows
          grep -R -q 'actions/checkout@v6' .github/workflows
          test ! -d .upgrade
          ! find .github/workflows -maxdepth 1 -type f \( -name 'temporary-*' -o -name 'export-*' \) | grep -q .

      - name: Test stable dependencies
        run: |
          set -euo pipefail
          rm -rf vendor composer.lock .phpunit.cache
          composer update --prefer-dist --no-interaction
          find . -path ./vendor -prune -o -path ./.git -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          vendor/bin/phpunit -c phpunit.xml.dist --display-deprecations --display-phpunit-deprecations --display-phpunit-notices --fail-on-phpunit-notice --display-notices --display-skipped

      - name: Test lowest dependencies
        run: |
          set -euo pipefail
          rm -rf vendor composer.lock .phpunit.cache
          composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction
          find . -path ./vendor -prune -o -path ./.git -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          vendor/bin/phpunit -c phpunit.xml.dist --display-deprecations --display-phpunit-deprecations --display-phpunit-notices --fail-on-phpunit-notice --display-notices --display-skipped

      - name: Verify review and merge
        run: |
          set -euo pipefail
          pr='${{ steps.candidate.outputs.number }}'
          if [ '${{ steps.candidate.outputs.draft }}' = 'true' ]; then gh pr ready "$pr" -R "$REPOSITORY"; fi
          unresolved=$(gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' -F owner=azine -F name=AzineSocialBarBundle -F number="$pr" --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved==false)] | length')
          test "$unresolved" = '0'
          gh pr edit "$pr" -R "$REPOSITORY" --body "$(cat <<'EOF'
## Summary

Authoritative PHP 8.5 / Symfony 7.4 upgrade for AzineSocialBarBundle.

- modern Symfony 7.4 component and dependency-injection APIs;
- Twig 3 integration with the documented social-bar rendering contract preserved;
- removal of obsolete CI/runtime integrations and temporary upgrade helpers;
- PHPUnit 12 coverage with stable and lowest dependency validation;
- strict Composer validation and full source/test linting;
- updated installation, asset and migration documentation.

Part of #5.
EOF
)"
          gh pr merge "$pr" -R "$REPOSITORY" --squash --delete-branch --subject 'Upgrade AzineSocialBarBundle to PHP 8.5 and Symfony 7.4'

      - name: Publish next major stable release
        run: |
          set -euo pipefail
          git fetch origin master --tags
          git checkout --detach origin/master
          latest=$(git tag -l --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -z "$latest" ]; then version=1.0.0; else version=$(python3 - "$latest" <<'PY'
          import re,sys
          m=re.fullmatch(r'v?(\d+)\.(\d+)\.(\d+)',sys.argv[1])
          print(f'{int(m.group(1))+1}.0.0')
          PY
          ); fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then test "$(git rev-list -n1 "$version")" = "$(git rev-parse HEAD)"; else git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git tag -a "$version" -m "AzineSocialBarBundle $version"; git push origin "$version"; fi
          if ! gh release view "$version" -R "$REPOSITORY" >/dev/null 2>&1; then gh release create "$version" -R "$REPOSITORY" --verify-tag --title "$version — PHP 8.5 / Symfony 7.4" --notes 'Major upgrade to PHP 8.5, Symfony 7.4, Twig 3 and PHPUnit 12. Includes modern dependency injection, preserved documented social-bar rendering behavior, removal of legacy CI/runtime integrations, and stable/lowest dependency validation.'; fi
          children=$(gh issue list -R "$REPOSITORY" --state open --limit 100 --search '"Parent epic: #5"' --json number --jq '.[].number')
          for issue in $children; do gh issue comment "$issue" -R "$REPOSITORY" --body "Completed by the merged PHP 8.5/Symfony 7.4 upgrade and released as \`$version\`."; gh issue close "$issue" -R "$REPOSITORY" --reason completed; done
          gh issue comment 5 -R "$REPOSITORY" --body "Upgrade complete. The authoritative candidate passed independent stable/lowest PHP 8.5 validation, was merged to \`master\`, and was published as immutable release \`$version\`."
          gh issue close 5 -R "$REPOSITORY" --reason completed
          git push origin --delete automation/finalize-php85-20260831 || true
