name: Apply Social Bar final upgrade fixes

on:
  push:
    branches: [fix/finalize-symfony-7.4-upgrade]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/finalize-symfony-7.4-upgrade
      - name: Fix Twig 3 templates and strict test gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('Resources/views').glob('*.twig'):
              text = p.read_text()
              text = text.replace('{% spaceless %}\n', '').replace('{% endspaceless %}\n', '')
              text = text.replace('sameas(false)', 'same as(false)')
              p.write_text(text)
          PY
          rm -f .travis.yml
          rm -f .github/workflows/temporary-finalize.yml
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finish Twig 3 compatibility cleanup'
          git push origin HEAD:fix/finalize-symfony-7.4-upgrade
